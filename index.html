<meta charset="utf-8">
<title>Speedway Empire 3D</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Menedżer klubu żużlowego z meczami 15 biegów w 3D: skład w limicie KSM, treningi, kontrakty, finanse i play-off.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=Caveat:wght@600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#E0632E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<!-- Warstwa menedżerska -->
<div id="mgr"></div>

<!-- Dzień meczowy: świat 3D + grafika telewizyjna -->
<div id="md" hidden>
  <canvas id="gl" aria-label="Widok 3D toru żużlowego"></canvas>
  <div id="md-hud" class="hud" hidden>
    <header class="topline"><div class="brand">Speedway<b>Empire 3D</b></div><div class="score" id="md-score"></div></header>
    <aside class="order" id="md-order"></aside>
    <div class="ticker" id="md-ticker" aria-live="polite"></div>
    <footer class="controls"><div class="seg" id="md-cams"></div><div class="seg" id="md-speeds"></div></footer>
  </div>
  <!-- Zegary kierowcy i przyciski dotykowe (gdy gracz prowadzi motocykl) -->
  <div id="ride-hud" hidden>
    <div class="gauge"><b id="rh-speed">0</b><small>km/h</small>
      <div class="gripbar" title="Przyczepność: czerwony = za szybko na łuk"><i id="rh-grip"></i></div><small>przyczepność</small>
      <div class="rh-row"><span id="rh-pos"></span><span id="rh-lap"></span></div></div>
    <div id="rh-tip"></div>
    <div class="touch"><button id="rh-left" aria-label="Do krawężnika">◀</button><button id="rh-right" aria-label="Na zewnątrz">▶</button><button id="rh-thr" aria-label="Gaz">GAZ</button></div>
  </div>
  <div id="md-panel"></div>
</div>

<div id="modal"></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
